[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "localagent"
version = "0.2.0"
description = "Terminal autonomous LLM agent for a closed contour"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "localagent contributors"}]
keywords = ["llm", "agent", "automation", "closed-contour"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx==0.28.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-timeout==2.3.1",
  "pytest-cov==7.0.0",
  "ruff==0.13.3",
  "mypy==1.18.2",
  "build==1.3.0",
]

[project.scripts]
agent = "localagent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["timeout(seconds): fail a test if it exceeds the configured timeout"]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_unused_ignores = true


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localagent = ["py.typed"]
