name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q --cov=localagent.agent --cov=localagent.policy --cov=localagent.security --cov=localagent.events --cov=localagent.context --cov=localagent.knowledge --cov=localagent.session --cov-report=term-missing --cov-fail-under=85
      - run: python -m build

  kernel-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_exec_compliance.py -k 'kernel_sandbox or script_and_scratch or module'
